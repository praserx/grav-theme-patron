name: Patron
slug: patron
type: theme
version: 3.0.0-alpha
description: "Patron theme orginaly made for non-profit organization"
icon: asterisk
author:
    name: Praser
    email: praserx@gmail.com
    url: https://github.com/praserx
homepage: https://github.com/praserx/grav-theme-patron
keywords: patron, theme, core, modern, fast, responsive, html5, css3, non-profit
bugs: https://github.com/praserx/grav-theme-patron/issues
license: MIT

compatibility:
    grav:
        - "1.7"
        - "2.0"

dependencies:
    - { name: grav, version: ">=1.7.0" }
    - { name: form, version: ">=4.1.0" }
    - { name: login, version: ">=3.3.0" }
    - { name: pagination, version: ">=1.4.0" }
    - { name: breadcrumbs, version: ">=1.6.0" }
    - { name: unitegallery, version: ">=1.1.0" }

form:
    validation: strict
    fields:
        theme.tabs:
            type: tabs
            fields:
                organization.tab:
                    type: tab
                    title: Organization profile
                    fields:
                        tab.columns:
                            type: columns
                            fields:
                                col1:
                                    type: column
                                    fields:
                                        organization.main_contact.name:
                                            type: text
                                            style: vertical
                                            label: Organization or branch name
                                            placeholder: "Northbridge Community"
                                            help: Public name of the organization or branch.

                                        organization.main_contact.address:
                                            type: text
                                            style: vertical
                                            label: Street address
                                            placeholder: "18 Meadow Lane"
                                            help: Street and building address for the organization or branch.

                                        organization.main_contact.country:
                                            type: text
                                            style: vertical
                                            label: City, postal code and country
                                            placeholder: "Northbridge, NB4 2QT, United Kingdom"
                                            help: City, postal code, and country shown in the public contact details.

                                        organization.main_contact.email:
                                            type: text
                                            style: vertical
                                            label: Public contact email
                                            placeholder: "hello@example.org"
                                            help: Public email address for the organization or current branch.

                                        organization.description:
                                            type: textarea
                                            style: vertical
                                            label: Short organization description
                                            placeholder: "A community group in Northbridge for people who learn by doing."
                                            help: Brief description shown in the site footer.
                                            rows: 3
                                col2:
                                    type: column
                                    fields:
                                        organization.logo:
                                            name: logo
                                            type: file
                                            style: vertical
                                            label: Organization logo
                                            destination: "theme@:/images"
                                            help: Logo shown in the landing-page header. A transparent PNG or SVG works best.
                                            multiple: false
                                            autofocus: false
                                            accept:
                                                - image/*

                                        organization.background:
                                            name: background
                                            type: file
                                            style: vertical
                                            label: Background image
                                            destination: "theme@:/images"
                                            help: Image used behind the landing-page header. Use a wide image with enough contrast for text.
                                            multiple: false
                                            autofocus: false
                                            accept:
                                                - image/*

                        organization.headquarters.contacts:
                            type: list
                            label: Key contacts
                            help: Add people who should appear on the organization contacts page.
                            fields:
                                .name:
                                    type: text
                                    label: Full name
                                    placeholder: "Morgan Reed"
                                .nickname:
                                    type: text
                                    label: Preferred name
                                    placeholder: "Morgan"
                                .title:
                                    type: text
                                    label: Title
                                    placeholder: "Branch coordinator"
                                .phone:
                                    type: text
                                    label: Phone
                                    placeholder: "+44 20 1234 5678"
                                .email:
                                    type: text
                                    label: Email
                                    placeholder: "morgan@example.org"
                                    validate:
                                        type: email
                                .photo:
                                    type: file
                                    label: Photo
                                    help: Optional profile photo shown on the contacts page.
                                    destination: "theme@:/images"
                                    multiple: false
                                    autofocus: false
                                    accept:
                                        - image/*

                socials.tab:
                    type: tab
                    title: Socials & links
                    fields:
                        tab.columns:
                            type: columns
                            fields:
                                col1:
                                    type: column
                                    fields:
                                        socials.facebook:
                                            type: text
                                            style: vertical
                                            label: Facebook page
                                            placeholder: "https://www.facebook.com/my-community"
                                            help: Full URL of the organization or branch Facebook page. Leave blank if unused.

                                        socials.links:
                                            type: array
                                            style: vertical
                                            label: Useful links
                                            help: Add partner, headquarters, documentation, or other useful links.
                                            placeholder_key: Link name
                                            placeholder_value: "https://example.org"
                                col2:
                                    type: column
                                    fields:
                                        spacer:
                                            name: honeypot
                                            type: honeypot

                settings.tab:
                    type: tab
                    title: Site settings
                    fields:
                        tab.columns:
                            type: columns
                            fields:
                                col1:
                                    type: column
                                    fields:
                                        settings.copyright:
                                            type: text
                                            style: vertical
                                            label: Footer copyright text
                                            placeholder: "2026 Northbridge Community"
                                            help: Text shown after the copyright symbol in the footer.
                                        settings.additional_page_info:
                                            type: textarea
                                            style: vertical
                                            label: Footer note
                                            placeholder: "All names, dates, and details on this page are fictional."
                                            help: Optional additional note shown on the right side of the footer.
                                            rows: 3
                                col2:
                                    type: column
                                    fields:
                                        settings.color_palette:
                                            type: select
                                            style: vertical
                                            label: Site color palette
                                            help: Choose a coordinated color palette for the whole site.
                                            default: patron
                                            options:
                                                patron: Patron blue
                                                forest: Forest and honey
                                                terracotta: Terracotta and plum
                                                slate: Slate and coral
                                        settings.favicon:
                                            name: favicon
                                            type: file
                                            style: vertical
                                            label: Site favicon
                                            destination: "theme@:/images"
                                            help: Small icon shown in browser tabs. PNG, SVG, or ICO formats are supported.
                                            multiple: false
                                            autofocus: false
                                            accept:
                                                - image/png
                                                - image/svg+xml
                                                - image/x-icon
                                        settings.show_login:
                                            type: toggle
                                            style: vertical
                                            label: Show login link
                                            highlight: 1
                                            help: Show the public login link in the main menu. Signed-in users still see their account menu.
                                            default: 1
                                            options:
                                                1: Yes
                                                0: No
                                            validate:
                                                type: bool
