# Theme metadata
name: Patron
version: 2.0.0
description: "Patron theme originally made for non-profit organization"
icon: asterisk

# Author information
author:
  name: Praser
  email: praserx@gmail.com
  url: https://github.com/praserx

# Project information
homepage: https://github.com/praserx/grav-theme-patron
keywords: patron, theme, core, modern, fast, responsive, html5, css3, non-profit
bugs: https://github.com/praserx/grav-theme-patron/issues
license: MIT

# Theme dependencies
dependencies:
  # Grav CMS
  - { name: grav, version: '>=1.7.0' }
  # Plugins
  - { name: form, version: '>=4.1.0' }
  - { name: login, version: '>=3.3.0' }
  - { name: pagination, version: '>=1.4.0' }
  - { name: breadcrumbs, version: '>=1.6.0' }
  - { name: unitegallery, version: '>=1.1.0' }

# Form configuration
form:
  validation: strict
  fields:
    theme.tabs:
      type: tabs
      fields:
        # Organization tab
        organization.tab:
          type: tab
          title: Your organization
          import@:
            type: blueprints/theme/organization
            context: themes://patron

        # Socials & Links tab
        socials.tab:
          type: tab
          title: Site settings
          import@:
            type: blueprints/theme/settings_site
            context: themes://patron

        # Settings tab
        settings.tab:
          type: tab
          title: Modules settings
          import@:
            type: blueprints/theme/settings_modules
            context: themes://patron
